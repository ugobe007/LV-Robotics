server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    
    # Include default MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://ubanpswucfkdvixityoe.supabase.co; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com data: blob:; img-src 'self' https://images.unsplash.com https: data: blob:; media-src 'self' https: blob: data:; connect-src 'self' https: https://ubanpswucfkdvixityoe.supabase.co; object-src 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Cache static assets
    location ~* \.(js|css|jpg|jpeg|png|gif|ico|svg|webp|heic|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy ReadyForRobots public API (same-origin to avoid CORS)
    location /rfr-api/ {
        proxy_pass https://ready-2-robot.fly.dev/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host ready-2-robot.fly.dev;
        proxy_set_header Origin https://readyforrobots.com;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_connect_timeout 10s;
        proxy_read_timeout 25s;
        add_header Cache-Control "public, max-age=300";
    }

    # SPA routing - serve index.html for all non-file routes
    location / {
        try_files $uri /index.html;
    }
}