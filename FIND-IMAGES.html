<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find & Migrate Images - LV Robotics</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            padding: 2rem;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #a8e6a1; margin-bottom: 2rem; text-align: center; }
        .section {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .section h2 {
            color: #a8e6a1;
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }
        .status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }
        .status.success { background: #16a34a; color: white; }
        .status.error { background: #dc2626; color: white; }
        .status.loading { background: #f59e0b; color: white; }
        .log {
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            max-height: 300px;
            overflow-y: auto;
            color: #94a3b8;
        }
        .log-line { margin-bottom: 0.5rem; }
        .log-line.error { color: #f87171; }
        .log-line.success { color: #86efac; }
        .log-line.info { color: #60a5fa; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .gallery-item {
            position: relative;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 1;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .gallery-item-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.8);
            padding: 0.5rem;
            font-size: 0.75rem;
            color: #a8e6a1;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .gallery-item:hover .gallery-item-info { opacity: 1; }
        button {
            background: #a8e6a1;
            color: #0f172a;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }
        button:hover { background: #7dd599; }
        button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Find & Migrate Images</h1>

        <!-- Check Current Posts -->
        <div class="section">
            <h2>
                1️⃣ Check Current Posts Table
                <span id="postsStatus" class="status loading">Checking...</span>
            </h2>
            <div class="log" id="postsLog"></div>
            <button onclick="checkCurrentPosts()">Refresh Posts Data</button>
        </div>

        <!-- Check Storage Buckets -->
        <div class="section">
            <h2>
                2️⃣ Check Storage Buckets
                <span id="storageStatus" class="status loading">Checking...</span>
            </h2>
            <div class="log" id="storageLog"></div>
            <button onclick="checkStorageBuckets()">Refresh Storage Data</button>
        </div>

        <!-- Found Images -->
        <div class="section">
            <h2>
                3️⃣ Found Images
                <span id="imagesStatus" class="status">0 Found</span>
            </h2>
            <div class="gallery" id="galleryContainer"></div>
        </div>

        <!-- Actions -->
        <div class="section">
            <h2>4️⃣ Actions</h2>
            <button onclick="migrateImagesAsPosts()">📤 Migrate Found Images as Posts</button>
            <button onclick="createSamplePosts()">📝 Create Sample Posts</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tzitghqmrmsxddysxhvc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6aXRnaHFtcm1zeGRkeXN4aHZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE5NDAzMjMsImV4cCI6MjA3NzUxNjMyM30.f5rZPAdCOHe6ZXr_TYgmhUkZkcWsSYX_qMLXUgg9dZ8';
        
        let supabase = null;
        let foundImages = [];

        function logToElement(elementId, message, type = 'info') {
            const log = document.getElementById(elementId);
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            line.textContent = message;
            log.appendChild(line);
            log.scrollTop = log.scrollHeight;
        }

        async function initSupabase() {
            if (!supabase) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
            return supabase;
        }

        async function checkCurrentPosts() {
            const log = document.getElementById('postsLog');
            log.innerHTML = '';
            logToElement('postsLog', '⏳ Checking posts table...');

            try {
                const client = await initSupabase();
                
                // Count all posts
                const { count: totalCount } = await client
                    .from('posts')
                    .select('id', { count: 'exact' });
                
                logToElement('postsLog', `Total posts in table: ${totalCount}`, 'success');

                // Count by media type
                const { data: allPosts } = await client
                    .from('posts')
                    .select('id, media_type, media_url');

                const byType = {};
                allPosts?.forEach(p => {
                    byType[p.media_type || 'null'] = (byType[p.media_type || 'null'] || 0) + 1;
                });

                Object.entries(byType).forEach(([type, count]) => {
                    logToElement('postsLog', `  - ${type}: ${count} posts`, 'info');
                });

                if (totalCount > 0) {
                    logToElement('postsLog', '✅ Posts found in table!', 'success');
                    document.getElementById('postsStatus').textContent = `${totalCount} Posts`;
                    document.getElementById('postsStatus').className = 'status success';
                } else {
                    logToElement('postsLog', '⚠️ No posts in table yet', 'error');
                    document.getElementById('postsStatus').textContent = 'No Posts';
                    document.getElementById('postsStatus').className = 'status error';
                }

            } catch (error) {
                logToElement('postsLog', `❌ Error: ${error.message}`, 'error');
                document.getElementById('postsStatus').className = 'status error';
            }
        }

        async function checkStorageBuckets() {
            const log = document.getElementById('storageLog');
            log.innerHTML = '';
            logToElement('storageLog', '⏳ Checking storage buckets...');
            foundImages = [];

            try {
                const client = await initSupabase();
                const buckets = ['community-media', 'member-photos'];

                for (const bucket of buckets) {
                    logToElement('storageLog', `\n📦 Bucket: ${bucket}`);
                    
                    try {
                        const { data, error } = await client.storage.from(bucket).list();
                        
                        if (error) {
                            logToElement('storageLog', `  Error: ${error.message}`, 'error');
                            continue;
                        }

                        if (!data || data.length === 0) {
                            logToElement('storageLog', `  (empty)`, 'info');
                            continue;
                        }

                        logToElement('storageLog', `  Found ${data.length} items:`, 'success');
                        
                        // Look for image files
                        data.forEach(item => {
                            if (item.name && /\.(jpg|jpeg|png|gif|webp)$/i.test(item.name)) {
                                logToElement('storageLog', `    ✓ ${item.name}`, 'success');
                                foundImages.push({
                                    bucket,
                                    name: item.name,
                                    url: `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${item.name}`
                                });
                            }
                        });
                    } catch (err) {
                        logToElement('storageLog', `  Exception: ${err.message}`, 'error');
                    }
                }

                document.getElementById('storageStatus').textContent = `${foundImages.length} Images`;
                document.getElementById('storageStatus').className = foundImages.length > 0 ? 'status success' : 'status error';
                
                // Display found images
                displayFoundImages();

            } catch (error) {
                logToElement('storageLog', `❌ Error: ${error.message}`, 'error');
                document.getElementById('storageStatus').className = 'status error';
            }
        }

        function displayFoundImages() {
            const container = document.getElementById('galleryContainer');
            container.innerHTML = '';
            document.getElementById('imagesStatus').textContent = `${foundImages.length} Found`;

            if (foundImages.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; color: #94a3b8;">No images found in storage</p>';
                return;
            }

            foundImages.forEach(img => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML = `
                    <img src="${img.url}" alt="${img.name}" onerror="this.style.display='none'; this.parentElement.innerHTML='❌'">
                    <div class="gallery-item-info">${img.name}</div>
                `;
                container.appendChild(item);
            });
        }

        async function migrateImagesAsPosts() {
            if (foundImages.length === 0) {
                alert('No images found to migrate. Run "Check Storage Buckets" first.');
                return;
            }

            if (!confirm(`Migrate ${foundImages.length} images as posts? This will create a post for each image.`)) {
                return;
            }

            const client = await initSupabase();
            let created = 0;

            for (const img of foundImages) {
                try {
                    const { error } = await client.from('posts').insert({
                        text: `Community highlight: ${img.name}`,
                        media_url: img.url,
                        media_type: 'image',
                        user_id: null
                    });

                    if (error) throw error;
                    created++;
                    logToElement('postsLog', `✅ Created post for: ${img.name}`, 'success');
                } catch (error) {
                    logToElement('postsLog', `❌ Failed: ${img.name} - ${error.message}`, 'error');
                }
            }

            alert(`✅ Migrated ${created}/${foundImages.length} images as posts!`);
            await checkCurrentPosts();
        }

        async function createSamplePosts() {
            if (!confirm('Create 5 sample image posts using unsplash photos?')) {
                return;
            }

            const client = await initSupabase();
            const sampleImages = [
                { text: 'Robot demonstration', photoId: '1551958551-acf5d5551424' },
                { text: 'Robotics workshop', photoId: '1543269867-cbf427effbad' },
                { text: 'Community project', photoId: '1516321318423-f06e7ff28bbc' },
                { text: 'Innovation showcase', photoId: '1531482615572-f4e06b6e46f8' },
                { text: 'Tech in action', photoId: '1460925895917-aeb19d518dc3' }
            ];

            let created = 0;
            for (const sample of sampleImages) {
                try {
                    const unsplashUrl = `https://images.unsplash.com/photo-${sample.photoId}?w=800&q=80`;
                    const { error } = await client.from('posts').insert({
                        text: sample.text,
                        media_url: unsplashUrl,
                        media_type: 'image',
                        user_id: null
                    });

                    if (error) throw error;
                    created++;
                    logToElement('postsLog', `✅ Created: ${sample.text}`, 'success');
                } catch (error) {
                    logToElement('postsLog', `❌ Failed: ${error.message}`, 'error');
                }
            }

            alert(`✅ Created ${created} sample posts!`);
            await checkCurrentPosts();
        }

        // Run checks on load
        window.addEventListener('load', async () => {
            await checkCurrentPosts();
            await checkStorageBuckets();
        });
    </script>
</body>
</html>
